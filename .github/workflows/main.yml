name: Build Inventory EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'
        
    - name: Build and Publish
      run: dotnet publish ./Presentation/ASPNET/Indotalent.Web.csproj -c Release -r win-x64 -o ./publish-output
      
    - name: Upload EXE
      uses: actions/upload-artifact@v4
      with:
        name: InventorySystem-EXE
        path: ./publish-output/
